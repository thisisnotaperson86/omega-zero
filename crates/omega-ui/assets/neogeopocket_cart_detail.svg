<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 216 188">
  <!-- the cart's edges: its left and top catch the light, its right and bottom turn away -->
  <rect x="0" y="14" width="4" height="166" fill="#fff" fill-opacity="0.3"/>
  <rect x="14" y="0" width="188" height="4" fill="#fff" fill-opacity="0.3"/>
  <rect x="212" y="14" width="4" height="166" fill="#000" fill-opacity="0.45"/>
  <rect x="8" y="184" width="200" height="4" fill="#000" fill-opacity="0.35"/>
  <!-- the raised lip across the top: two grooves over its middle, a step under it -->
  <rect x="40" y="12" width="136" height="3" fill="#000" fill-opacity="0.4"/>
  <rect x="40" y="15" width="136" height="2" fill="#fff" fill-opacity="0.15"/>
  <rect x="40" y="20" width="136" height="3" fill="#000" fill-opacity="0.4"/>
  <rect x="6" y="31" width="204" height="3" fill="#000" fill-opacity="0.45"/>
  <rect x="6" y="34" width="204" height="2" fill="#fff" fill-opacity="0.2"/>
  <!-- the label's well: shadow along its top and left, a lit lip under and right of it -->
  <rect x="15" y="41" width="185" height="4" rx="2" fill="#000" fill-opacity="0.45"/>
  <rect x="15" y="45" width="4" height="96" fill="#000" fill-opacity="0.4"/>
  <rect x="19" y="141" width="181" height="4" rx="2" fill="#fff" fill-opacity="0.25"/>
  <rect x="196" y="45" width="4" height="100" fill="#fff" fill-opacity="0.22"/>
  <!-- the two pill-shaped grips in the foot and the triangle between them -->
  <rect x="17" y="158" width="63" height="19" rx="9" fill="#000" fill-opacity="0.45"/>
  <rect x="136" y="158" width="63" height="19" rx="9" fill="#000" fill-opacity="0.45"/>
  <polygon points="94,160 122,160 108,174" fill="#000" fill-opacity="0.45"/>
</svg>
