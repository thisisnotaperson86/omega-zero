<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 272 264">
  <!-- the cart's edges: its left and top catch the light, its right and bottom turn away -->
  <rect x="0" y="22" width="5" height="236" fill="#fff" fill-opacity="0.3"/>
  <rect x="22" y="0" width="228" height="5" fill="#fff" fill-opacity="0.3"/>
  <rect x="267" y="22" width="5" height="236" fill="#000" fill-opacity="0.45"/>
  <rect x="6" y="259" width="260" height="5" fill="#000" fill-opacity="0.35"/>
  <!-- the thick cap across the top, three grip ridges over its middle -->
  <rect x="66" y="22" width="140" height="3" fill="#000" fill-opacity="0.4"/>
  <rect x="66" y="25" width="140" height="2" fill="#fff" fill-opacity="0.15"/>
  <rect x="66" y="30" width="140" height="3" fill="#000" fill-opacity="0.4"/>
  <rect x="66" y="33" width="140" height="2" fill="#fff" fill-opacity="0.15"/>
  <rect x="66" y="38" width="140" height="3" fill="#000" fill-opacity="0.4"/>
  <!-- the label's well, its corners round: shadow along its top and left, a lit lip under and right of it -->
  <rect x="23" y="41" width="229" height="4" rx="2" fill="#000" fill-opacity="0.45"/>
  <rect x="23" y="45" width="4" height="162" fill="#000" fill-opacity="0.4"/>
  <rect x="27" y="207" width="225" height="4" rx="2" fill="#fff" fill-opacity="0.25"/>
  <rect x="248" y="45" width="4" height="166" fill="#fff" fill-opacity="0.22"/>
  <!-- the pill-shaped grip in the foot -->
  <rect x="82" y="226" width="106" height="25" rx="12" fill="#000" fill-opacity="0.45"/>
  <rect x="84" y="249" width="102" height="2" fill="#fff" fill-opacity="0.22"/>
</svg>
