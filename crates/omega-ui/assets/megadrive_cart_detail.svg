<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 436 280">
  <!-- the cart's edges roll back: its left and top catch the light, its right and bottom turn away -->
  <rect x="0" y="13" width="6" height="247" fill="#fff" fill-opacity="0.3"/>
  <rect x="13" y="0" width="410" height="4" fill="#fff" fill-opacity="0.3"/>
  <rect x="430" y="13" width="6" height="247" fill="#000" fill-opacity="0.45"/>
  <rect x="20" y="275" width="396" height="5" fill="#000" fill-opacity="0.35"/>
  <!-- the label's well, open to the top edge and wide between two broad shoulders: a groove
       down its left side, a lit lip under it, the right side turned away -->
  <rect x="64" y="0" width="2" height="244" fill="#fff" fill-opacity="0.4"/>
  <rect x="66" y="0" width="3" height="242" fill="#000" fill-opacity="0.4"/>
  <rect x="69" y="242" width="304" height="4" rx="2" fill="#fff" fill-opacity="0.3"/>
  <rect x="373" y="0" width="3" height="246" fill="#000" fill-opacity="0.35"/>
  <rect x="376" y="0" width="2" height="246" fill="#fff" fill-opacity="0.18"/>
  <!-- the grip ribs down each shoulder -->
  <rect x="34" y="14" width="3" height="236" fill="#000" fill-opacity="0.4"/>
  <rect x="37" y="14" width="2" height="236" fill="#fff" fill-opacity="0.15"/>
  <rect x="44" y="14" width="3" height="236" fill="#000" fill-opacity="0.4"/>
  <rect x="47" y="14" width="2" height="236" fill="#fff" fill-opacity="0.15"/>
  <rect x="386" y="14" width="3" height="236" fill="#000" fill-opacity="0.4"/>
  <rect x="389" y="14" width="2" height="236" fill="#fff" fill-opacity="0.15"/>
  <rect x="396" y="14" width="3" height="236" fill="#000" fill-opacity="0.4"/>
  <rect x="399" y="14" width="2" height="236" fill="#fff" fill-opacity="0.15"/>
  <!-- the step along the foot, over the contacts -->
  <rect x="24" y="258" width="388" height="3" fill="#000" fill-opacity="0.4"/>
  <rect x="24" y="261" width="388" height="2" fill="#fff" fill-opacity="0.15"/>
</svg>
