<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 304">
  <!-- the cart's edges roll back: its left and top catch the light, its right and bottom turn away -->
  <rect x="0" y="32" width="6" height="264" fill="#fff" fill-opacity="0.3"/>
  <rect x="32" y="0" width="384" height="5" fill="#fff" fill-opacity="0.3"/>
  <rect x="442" y="32" width="6" height="264" fill="#000" fill-opacity="0.45"/>
  <rect x="8" y="299" width="432" height="5" fill="#000" fill-opacity="0.35"/>
  <!-- the label's well, its corners round: shadow along its top and left, a lit lip under and right of it -->
  <rect x="61" y="7" width="326" height="4" rx="2" fill="#000" fill-opacity="0.45"/>
  <rect x="61" y="11" width="4" height="267" fill="#000" fill-opacity="0.4"/>
  <rect x="65" y="278" width="322" height="4" rx="2" fill="#fff" fill-opacity="0.25"/>
  <rect x="383" y="11" width="4" height="271" fill="#fff" fill-opacity="0.22"/>
  <!-- the grip ribs down each shoulder beside the label -->
  <rect x="14" y="70" width="3" height="170" fill="#000" fill-opacity="0.4"/>
  <rect x="17" y="70" width="2" height="170" fill="#fff" fill-opacity="0.15"/>
  <rect x="26" y="70" width="3" height="170" fill="#000" fill-opacity="0.4"/>
  <rect x="29" y="70" width="2" height="170" fill="#fff" fill-opacity="0.15"/>
  <rect x="38" y="70" width="3" height="170" fill="#000" fill-opacity="0.4"/>
  <rect x="41" y="70" width="2" height="170" fill="#fff" fill-opacity="0.15"/>
  <rect x="407" y="70" width="3" height="170" fill="#000" fill-opacity="0.4"/>
  <rect x="410" y="70" width="2" height="170" fill="#fff" fill-opacity="0.15"/>
  <rect x="419" y="70" width="3" height="170" fill="#000" fill-opacity="0.4"/>
  <rect x="422" y="70" width="2" height="170" fill="#fff" fill-opacity="0.15"/>
  <rect x="431" y="70" width="3" height="170" fill="#000" fill-opacity="0.4"/>
  <rect x="434" y="70" width="2" height="170" fill="#fff" fill-opacity="0.15"/>
  <!-- the step along the foot, over the contacts -->
  <rect x="24" y="290" width="400" height="3" fill="#000" fill-opacity="0.4"/>
  <rect x="24" y="293" width="400" height="2" fill="#fff" fill-opacity="0.15"/>
</svg>
