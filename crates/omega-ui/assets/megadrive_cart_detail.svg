<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 436 280">
  <!-- the cart's edges roll back: its left and top catch the light, its right and bottom turn away -->
  <rect x="0" y="28" width="6" height="244" fill="#fff" fill-opacity="0.3"/>
  <rect x="28" y="0" width="380" height="5" fill="#fff" fill-opacity="0.3"/>
  <rect x="430" y="28" width="6" height="244" fill="#000" fill-opacity="0.45"/>
  <rect x="8" y="275" width="420" height="5" fill="#000" fill-opacity="0.35"/>
  <!-- the label's well: shadow along its top and left, a lit lip under and right of it -->
  <rect x="65" y="4" width="305" height="4" rx="2" fill="#000" fill-opacity="0.45"/>
  <rect x="65" y="8" width="4" height="248" fill="#000" fill-opacity="0.4"/>
  <rect x="69" y="256" width="301" height="4" rx="2" fill="#fff" fill-opacity="0.25"/>
  <rect x="366" y="8" width="4" height="252" fill="#fff" fill-opacity="0.22"/>
  <!-- the grip ribs down each shoulder beside the label -->
  <rect x="10" y="64" width="3" height="152" fill="#000" fill-opacity="0.4"/>
  <rect x="13" y="64" width="2" height="152" fill="#fff" fill-opacity="0.15"/>
  <rect x="20" y="64" width="3" height="152" fill="#000" fill-opacity="0.4"/>
  <rect x="23" y="64" width="2" height="152" fill="#fff" fill-opacity="0.15"/>
  <rect x="30" y="64" width="3" height="152" fill="#000" fill-opacity="0.4"/>
  <rect x="33" y="64" width="2" height="152" fill="#fff" fill-opacity="0.15"/>
  <rect x="401" y="64" width="3" height="152" fill="#000" fill-opacity="0.4"/>
  <rect x="404" y="64" width="2" height="152" fill="#fff" fill-opacity="0.15"/>
  <rect x="411" y="64" width="3" height="152" fill="#000" fill-opacity="0.4"/>
  <rect x="414" y="64" width="2" height="152" fill="#fff" fill-opacity="0.15"/>
  <rect x="421" y="64" width="3" height="152" fill="#000" fill-opacity="0.4"/>
  <rect x="424" y="64" width="2" height="152" fill="#fff" fill-opacity="0.15"/>
  <!-- the step along the foot, over the contacts -->
  <rect x="24" y="266" width="388" height="3" fill="#000" fill-opacity="0.4"/>
  <rect x="24" y="269" width="388" height="2" fill="#fff" fill-opacity="0.15"/>
</svg>
